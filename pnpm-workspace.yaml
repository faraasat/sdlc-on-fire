# pnpm settings.
#
# **These live here, not in `.npmrc`.** pnpm 10+ reads only auth and registry
# settings from `.npmrc`; everything else must be configured here or in the
# global config. Four settings were sitting inert in `.npmrc` until 2026-08-23
# — `link-workspace-packages`, `prefer-workspace-packages`, `save-exact` and
# `enable-pre-post-scripts` — and the giveaway was npm printing "Unknown project
# config" on every single invocation, which everyone had learned to scroll past.
#
# The one that mattered was `enable-pre-post-scripts=false`, whose comment in
# `.npmrc` claimed it stopped packages running install scripts. It does not do
# that even when it works — it controls whether pnpm runs `pre`/`post` hooks
# around *your own* scripts — and it was not working. Verified behaviourally: a
# `prefoo` script ran with the setting in place. The protection the comment
# described is `allowBuilds` below, which was correctly placed all along.

# Workspace packages resolve to the local source, never the registry.
linkWorkspacePackages: true
preferWorkspacePackages: true

# Reproducible installs: exact versions, never a caret range that drifts.
saveExact: true

# No `pre`/`post` hook fires implicitly around a named script. A release script
# that quietly gained a `prerelease` hook is a release nobody reviewed.
enablePrePostScripts: false

packages:
  - 'packages/*'

# Install scripts are denied by default (.npmrc). Anything listed here is an
# explicit, reviewed exception — ADR-0033 (supply-chain integrity).
allowBuilds:
  # esbuild's postinstall resolves the platform-native binary that tsup and
  # Vitest both execute. Without it neither build nor test can run.
  esbuild: true
  # The optional local-embedding runtime (P1-CTX-04). `onnxruntime-node`'s script
  # fetches the platform-native binary; without it there is no local inference at
  # all, and `protobufjs`/`sharp` arrive with it.
  #
  # Granted, and the grant is why `@huggingface/transformers` is an **optional**
  # dependency: a workspace unwilling to run these installs without it, and the
  # semantic retrieval leg then fails closed to lexical — which is the behaviour
  # contracts/05 §5.2 already specifies rather than a degradation invented here.
  onnxruntime-node: true
  protobufjs: true
  sharp: true
