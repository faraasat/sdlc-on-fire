# CI (P0-META-02) — lint, typecheck, test, build on every PR.
#
# `--frozen-lockfile` is the point of this file as much as the checks are
# (P0-META-03, ADR-0033): a CI run that silently resolves a different dependency
# tree than the lockfile records is not verifying the code anyone reviewed.
name: ci

# ─── Automatic runs disabled 2026-08-22 ──────────────────────────────────────
#
# The account's Actions minutes are exhausted, so every automatic trigger below
# was queueing runs that could never start — which is worse than no CI, because
# a permanently-pending check reads as "in progress" rather than as "not run".
# `release.yml` is deliberately left on its own triggers: publishing is the one
# pipeline whose absence would be silently destructive.
#
# The original triggers are preserved directly beneath, commented, so restoring
# is uncommenting rather than reconstructing. To restore: delete
# `workflow_dispatch:` and uncomment the block under it.
on:
  workflow_dispatch:
#
# Original triggers:
#   pull_request:
#   push:
#     branches: [main]

permissions:
  contents: read

jobs:
  check:
    # Windows is a first-class target (Q-02, ADR-0072), and a support tier that
    # is never exercised is a claim rather than a commitment. `/bin/sh` was
    # hardcoded in the verify path for exactly as long as CI was Linux-only:
    # `sdlc verify` — the gate, which is the product's whole point — could not
    # run at all on a native Windows host while every check here stayed green.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Lockfile-enforced install. Fails rather than updating the lockfile.
      - run: pnpm install --frozen-lockfile

      # Order matters, and it is the same order `pnpm check` uses. Each step
      # produces what the next one needs:
      #   typecheck emits the .d.ts files the type-aware lint rules resolve
      #     against — without them every cross-package type is `error` and lint
      #     reports ~72 phantom problems on a clean checkout;
      #   build emits the dist/ the built-binary tests actually execute —
      #     without it those tests have no binary, and with a stale one they
      #     pass against an artifact the current source no longer produces.
      # Locally this ran green for months because both artifacts were lying
      # around from a previous run.
      - run: pnpm run format:check
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm run test

      # The built CLI must actually execute. A duplicate shebang once made
      # dist/index.js a syntax error while 320 unit tests stayed green, because
      # every one of them imported the module instead of running the artifact.
      - run: node packages/cli/dist/index.js --version

  # Would this actually install if published? Separate job because it needs to
  # run once, not three times — a tarball's contents do not vary by runner OS.
  #
  # This is on the PR rather than only in `release.yml` because the failure it
  # catches is invisible in the working tree. `sdlc-on-fire` declares eight
  # `workspace:*` dependencies; every test imports them from the workspace,
  # where they resolve perfectly, and every one would keep passing while the
  # published package failed on a consumer's first `npm install`.
  packable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # Packs every publishable package and inspects the artifact that would be
      # uploaded: no `workspace:` ranges surviving, siblings pinned to this
      # release's version, dist present, declared entry points actually packed,
      # exactly one shebang per bin.
      - run: pnpm run verify:package
