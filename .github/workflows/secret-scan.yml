# Secret scanning at the public boundary (P0-META-04, ADR-0061/ADR-0033).
#
# This repo is the *public* half of a two-repo topology: the planning repo is
# private and mounts this one as a submodule. That asymmetry is exactly what
# makes a leak easy — content moves outward across the boundary routinely, and
# nothing about a normal-looking commit signals which side it came from.
#
# Runs on every PR and push. A finding fails the job rather than warning: a
# secret that is merely reported is a secret that is already public.
name: secret-scan

# ─── Automatic runs disabled 2026-08-22 ──────────────────────────────────────
#
# The account's Actions minutes are exhausted, so every automatic trigger below
# was queueing runs that could never start — which is worse than no CI, because
# a permanently-pending check reads as "in progress" rather than as "not run".
# `release.yml` is deliberately left on its own triggers: publishing is the one
# pipeline whose absence would be silently destructive.
#
# The original triggers are preserved directly beneath, commented, so restoring
# is uncommenting rather than reconstructing. To restore: delete
# `workflow_dispatch:` and uncomment the block under it.
on:
  workflow_dispatch:
#
# Original triggers:
#   pull_request:
#   push:
#     branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret committed and then removed in a later commit
          # is still in the history, and still public.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
